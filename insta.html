<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YourBrand Login</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: #fafafa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        width: 360px;
        text-align: center;
    }

    .card {
        background: #fff;
        border: 1px solid #dbdbdb;
        padding: 30px 25px;
    }

    .brand {
        font-size: 36px;
        font-weight: bold;
        margin-bottom: 25px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-bottom: 8px;
        border: 1px solid #dbdbdb;
        border-radius: 3px;
        background: #fafafa;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #0095f6;
        border: none;
        color: #fff;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 10px;
    }

    .divider {
        display: flex;
        align-items: center;
        margin: 18px 0;
        color: #8e8e8e;
        font-size: 13px;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #dbdbdb;
    }

    .divider span {
        margin: 0 10px;
    }

    .social {
        color: #385185;
        font-weight: bold;
        font-size: 14px;
        text-decoration: none;
        display: block;
        margin-bottom: 12px;
    }

    .forgot {
        font-size: 13px;
        color: #00376b;
        text-decoration: none;
    }

    .signup {
        margin-top: 10px;
        padding: 20px;
        background: #fff;
        border: 1px solid #dbdbdb;
        font-size: 14px;
    }

    .signup a {
        color: #0095f6;
        font-weight: bold;
        text-decoration: none;
        margin-left: 5px;
    }
</style>
</head>

<body>

<div class="container">
    <div class="card">
        <div class="brand">YourBrand</div>

        <form>
            <input type="text" placeholder="Email or username" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <a href="#" class="social">Log in with Google</a>
        <a href="#" class="forgot">Forgot password?</a>
    </div>

    <div class="signup">
        Don’t have an account?
        <a href="#">Sign up</a>
    </div>
</div>

</body>
</html>
